name: Keep Alive
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Run at 00:00 every day

jobs:
  keep_alive:
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Use the Keep Alive action when needed
      - name: Keep Alive
        uses: pagopa/dx/actions/keep-alive@main
        with:
          bot_token: ${{ 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 }}
